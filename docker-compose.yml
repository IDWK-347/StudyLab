# StudyLab 本地基础设施 —— 阶段 1 只起 PostgreSQL（含 pgvector）
#
# 端口：宿主 5433 → 容器 5432
#   本机原生 PostgreSQL 18.4 已占用 5432，本项目不使用它，靠端口错开隔离。
#   后端跑在宿主机 → localhost:5433
#   后端跑在容器内 → postgres:5432
#
# 密码不写在本文档，全部由同目录 .env 注入（README 第 14 节编排要求 6）。

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: studylab-postgres
    environment:
      POSTGRES_DB: studylab
      POSTGRES_USER: studylab
      # 未在 .env 中提供 POSTGRES_PASSWORD 时，compose 直接报错退出，而不是静默起一个弱密码实例
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置，请先在 .env 中填写}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # 注意：本目录脚本仅在数据卷为空时执行一次（README 12.1）
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studylab -d studylab"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

# 后续阶段追加：elasticsearch（+IK）、minio、redis（可选）、nginx、backend、frontend
